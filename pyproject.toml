[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-chat"
version = "0.1.0"
description = "Local streaming chat against an OpenAI-compatible model server."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  # PDF text extraction. The other file types use the standard library.
  "pypdf>=5.1,<6",
]

[project.scripts]
local-chat = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "strings.json"]
